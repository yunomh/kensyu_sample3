  <h2>ゲームが好きな理由</h2>
  <p>私の趣味はゲームです。仕事や勉強の合間に遊ぶことで、良い気分転換になっています。
  ストーリーに感動したり、難しいステージをクリアしたときの達成感を味わえたりするのが魅力です。</p>
  <p>最近はオンラインで友人と協力プレイをすることも多く、離れていても一緒に楽しめるのがゲームの良いところだと感じています。</p>
