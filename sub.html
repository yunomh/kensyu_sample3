  <h2>RPG（ロールプレイングゲーム）</h2>
  <p>キャラクターを育てながら壮大な物語を進めていくジャンルです。
  じっくり世界観に浸れるところが好きです。</p>

  <h2>アクションゲーム</h2>
  <p>反射神経や操作テクニックが試されるジャンルです。
  練習を重ねて上達していく過程が楽しいです。</p>

  <h2>パズルゲーム</h2>
  <p>短い時間でも頭を使って楽しめるジャンルです。
  ちょっとした空き時間に遊ぶのにぴったりです。</p>
